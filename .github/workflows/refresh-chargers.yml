name: Refresh charger registry and health checks

on:
  schedule:
    # 03:00 UTC daily (~08:30 IST)
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Refresh national charger registry
        env:
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
        run: python refresh_chargers.py

      - name: Run daily charger health check
        env:
          OCM_API_KEY: ${{ secrets.OCM_API_KEY }}
        run: python check_charger_health.py

      - name: Commit updated registry/health files if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add every_charger_india.json charger_health.json
          git diff --cached --quiet || git commit -m "Automated daily charger registry + health refresh"
          git push
